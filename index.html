<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Kushu ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9ec4, #ffd6e8, #d8b4fe);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow-x: hidden;
}

.card {
    background: rgba(255,255,255,0.85);
    padding: 45px 30px;
    border-radius: 30px;
    box-shadow: 0 15px 50px rgba(255,0,100,0.2);
    max-width: 500px;
    width: 90%;
    animation: appear 1.5s ease;
    position: relative;
    z-index: 2;
}

h1 {
    color: #e91e63;
    font-size: 35px;
}

p {
    color: #9c2755;
    font-size: 19px;
    line-height: 1.8;
}

button {
    background: linear-gradient(45deg, #ff4081, #ff80ab);
    border: none;
    padding: 16px 30px;
    border-radius: 40px;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}

.heart {
    position: fixed;
    bottom: -50px;
    animation: float 7s linear infinite;
    font-size: 25px;
    pointer-events: none;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">

<h1>HEYYYY KUSHUUUU BBYYYY!!! ❤️</h1>

<p>
YOOOOOO MY PRETTIEST GIRLLLL!!! 🥹💗
</p>

<p>
I wanted to make something special for you,
something that belongs only to us.
</p>

<p>
So I made this little corner of the internet
just for my favourite person! 🌷
</p>

<button onclick="window.location.href='story.html'">
I HAVE SOMETHING FOR YOU 💌
</button>

</div>

<script>
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
